# Serving configuration for the static SvelteKit build.
#
# Carries over what Azure Static Web Apps did: the adapter's 404.html fallback, plus
# caching and security headers. See hf-apps-collection ADR-0009.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Azure disclosed neither a server name nor a version; without this the migration
    # would newly advertise the exact nginx version on every response and error page.
    server_tokens off;

    # Emit RELATIVE redirects. nginx builds directory redirects from the LISTEN port, so
    # the default would send a browser to http://host:8080/path/ — wrong scheme (TLS is
    # terminated upstream) and a port that is not published. This fires on any URL
    # missing the trailing slash the app's routing uses, so it is not an edge case.
    absolute_redirect off;

    # No gzip_static: unlike EBD this app's adapter runs with precompress: false, so
    # there are no .gz siblings. Traefik compresses at the edge instead (ADR-0013).

    # Container healthcheck target. Deliberately not logged — it runs every 30s.
    location = /healthz {
        access_log off;
        # default_type, NOT add_header: add_header APPENDS, so `add_header Content-Type`
        # emits a second Content-Type alongside the default. Two Content-Type headers
        # violate RFC 9110 and some proxies reject the response outright.
        default_type text/plain;
        include /etc/nginx/security-headers.conf;
        return 200 "ok\n";
    }

    # Runtime configuration written by docker/entrypoint.sh into a tmpfs (ADR-0008).
    # Never cached: it is how a client ID is changed without rebuilding the image.
    location = /config.js {
        alias /tmp/app-config/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    # Fingerprinted build output — safe to cache forever.
    #
    # error_page is overridden here so a MISSING chunk returns a plain 404 rather than
    # falling through to the HTML app shell. Serving 2 KB of HTML in response to a
    # <script src> gives the browser a MIME error instead of an honest 404, and that is
    # exactly the case that occurs when cached HTML references a chunk a deploy removed.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
        error_page 404 = @asset_not_found;
    }

    # EVERY entry document, not just the root one. Matching only "= /index.html" left
    # the prerendered sub-pages (/foo/index.html) with no Cache-Control at all, so
    # browsers applied heuristic freshness and kept serving stale HTML that referenced
    # chunks the next deploy had already deleted.
    location ~ ^/(.*/)?index\.html$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    location / {
        # =404 rather than a rewrite, so the 404.html body is served with a 404 STATUS —
        # what staticwebapp.config.json's responseOverrides did. The adapter's 404.html
        # contains the full app shell, so client-side routing still works from it.
        try_files $uri $uri/ =404;
    }

    # Plain-text 404 for asset requests (see /_app/immutable/ above).
    location @asset_not_found {
        default_type text/plain;
        include /etc/nginx/security-headers.conf;
        return 404 "not found\n";
    }

    error_page 404 /404.html;

    include /etc/nginx/security-headers.conf;

    # NOT bound on IPv6, deliberately. The base image's 10-listen-on-ipv6-by-default.sh
    # rewrites this file at startup, which a read-only root filesystem forbids, and an
    # unconditional "listen [::]:8080" makes the container fail to start outright on a
    # host with IPv6 disabled. Traefik reaches this over an IPv4 docker bridge and the
    # healthcheck uses 127.0.0.1, so nothing here needs IPv6.
}
