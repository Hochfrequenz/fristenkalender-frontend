# Serving configuration for the static SvelteKit build.
#
# Reproduces what Azure Static Web Apps did via staticwebapp.config.json: the 404.html
# fallback the adapter is configured with, plus sensible caching. See hf-apps-collection
# ADR-0009.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # No gzip_static here: unlike EBD this app's adapter runs with precompress: false,
    # so there are no .gz siblings to serve. Traefik's compress middleware handles it at
    # the edge instead (hf-apps-collection ADR-0013).


    # Container healthcheck target. Deliberately not logged — it runs every 30s.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Runtime configuration written by docker/entrypoint.sh into a tmpfs (ADR-0008).
    # Never cached: it is how a client ID is changed without rebuilding the image.
    location = /config.js {
        alias /var/cache/app-config/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    # Fingerprinted build output — safe to cache forever.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # index.html must never be cached, or clients keep loading an old bundle after a
    # deploy — the classic "why am I still seeing the old version" report.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    location / {
        # =404 rather than a rewrite, so the 404.html body is served with a 404 STATUS —
        # what staticwebapp.config.json's responseOverrides did. Serving HTML with 200
        # for a missing asset is worse than a plain 404: the browser reports a confusing
        # MIME-type error instead of a missing file. The adapter's 404.html contains the
        # full app shell, so client-side routing still works from it.
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    include /etc/nginx/security-headers.conf;
}
