# Security headers.
#
# Included explicitly in EVERY location that defines an add_header of its own, because
# nginx does NOT inherit add_header from an outer block into a location that sets one —
# so a single `add_header` at server level silently disappears from exactly the responses
# that also set Cache-Control. Verified by curling the built image.
add_header X-Content-Type-Options nosniff always;
