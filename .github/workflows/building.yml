name: "Building"
on:
  # Callable so the release pipeline can gate publishing on the SAME checks CI
  # already runs, instead of a second copy that can drift out of sync.
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          submodules: "recursive"
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20.19"
          cache: "npm"
      - name: Update lock file to keep package.json and package-lock.json in sync
        run: npm install
      - name: Install modules
        run: npm ci
      - name: Build frontend
        env:
          BASE_PATH: "/${{ github.event.repository.name }}"
        run: npm run build
