name: Publish container image

# Triggered by a RELEASE, not a bare tag pattern (review: @hf-kklein).
#
# A release is created deliberately, states pre-release vs production explicitly via a
# checkbox instead of us inferring it from the tag string, and brings autogenerated
# release notes along. Every release has a tag; not every tag has a release.
on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  # Hardcoded lowercase. ${{ github.repository }} yields "Hochfrequenz/..." and OCI
  # repository names must be lowercase — metadata-action lowercases its own input, but
  # the attestation subject and any printed reference would be unpullable.
  IMAGE_NAME: hochfrequenz/fristenkalender-frontend

jobs:
  # Quality gate (review: @hf-kklein). Tags are not restricted to main, so a release can
  # be cut from an unprotected feature branch — branch protection does not cover that
  # path. These call the SAME workflows CI runs, not a copy.
  lint:
    uses: ./.github/workflows/linting.yml
  format:
    uses: ./.github/workflows/formatting.yml
  build:
    uses: ./.github/workflows/building.yml
  e2e:
    uses: ./.github/workflows/integration-tests.yml
    secrets: inherit

  publish:
    name: Build and push to GHCR
    needs: [lint, format, build, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v7
        with:
          # A release can be cut from any branch, so check out the tag explicitly rather
          # than whatever the default ref resolves to.
          ref: ${{ github.event.release.tag_name }}
          submodules: recursive

      # The app serves static/version.json; both Azure workflows sed-patch it before
      # building. Without the same step the image reports v0.0.0 / dummy-commit-id.
      - name: Stamp build metadata into version.json
        run: |
          sed -i "s|\"build_date\": \"0001-01-01T00:00:00Z\"|\"build_date\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"|" static/version.json
          sed -i "s|\"commit_id\": \"dummy-commit-id\"|\"commit_id\": \"$(git rev-parse HEAD)\"|" static/version.json
          sed -i "s|\"build_branch\": \"dummy-branch\"|\"build_branch\": \"${{ github.event.release.tag_name }}\"|" static/version.json
          sed -i "s|\"version_tag\": \"v0.0.0\"|\"version_tag\": \"${{ github.event.release.tag_name }}\"|" static/version.json
          cat static/version.json

      # The built-in GITHUB_TOKEN is enough to push to GHCR under this org — no PAT to
      # create, store or rotate (review: @hf-kklein).
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # "latest" follows the release's own pre-release flag. Deriving it from the tag
          # string missed forms like v1.2.3-beta.1, which would have moved latest onto a
          # pre-release build.
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # hf-apps-collection pins images by digest, so surface it instead of making someone
      # run `imagetools inspect` to find it.
      - name: Digest to pin in hf-apps-collection
        run: |
          {
            echo "### Pin this in hf-apps-collection"
            echo
            echo '```yaml'
            echo "image: ${REGISTRY}/${IMAGE_NAME}:${TAG}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TAG: ${{ github.event.release.tag_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
